services:
  rabbitmq:
    image: rabbitmq:4-management
    ports:
      - "5672:5672"     # AMQP
      # EN: management UI (guest/guest).
      # PT: painel de administração (guest/guest).
      - "15672:15672"

  kafka:
    # EN: KRaft mode: no ZooKeeper.
    # PT: modo KRaft: sem ZooKeeper.
    image: apache/kafka:4.0.0
    ports:
      - "9092:9092"
